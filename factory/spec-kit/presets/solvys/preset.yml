schema_version: "1.0"

preset:
  id: "solvys"
  name: "Solvys Factory"
  version: "1.0.0"
  description: "Maps Spec Kit work into the Solvys PL lifecycle and Development Contract."
  author: "Solvys"
  repository: "https://github.com/solvys-technologies/solvys-skills"
  license: "MIT"

requires:
  speckit_version: "==0.16.2"

provides:
  templates:
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      strategy: "wrap"
    - type: "command"
      name: "speckit.taskstoissues"
      file: "commands/speckit.taskstoissues.md"
      strategy: "wrap"

tags:
  - "solvys"
  - "factory"
  - "development-contract"
  - "pl-lifecycle"
